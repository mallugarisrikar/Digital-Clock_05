<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock Project</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            transition: 0.4s;
        }

        .container {
            width: 90%;
            max-width: 550px;
            padding: 40px 25px;
            text-align: center;
            background: rgba(255,255,255,0.10);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            color: white;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 35px;
            letter-spacing: 3px;
        }

        .clock {
            font-size: clamp(42px, 11vw, 72px);
            font-weight: bold;
            color: #38bdf8;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        .date {
            font-size: 20px;
            color: #e2e8f0;
            margin-bottom: 10px;
        }

        .timezone {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 35px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        button {
            padding: 13px 20px;
            border: none;
            border-radius: 10px;
            background: #0284c7;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #0ea5e9;
            transform: translateY(-3px);
        }

        /* LIGHT MODE */

        body.light {
            background: linear-gradient(135deg, #dbeafe, #f8fafc);
        }

        body.light .container {
            background: rgba(255,255,255,0.85);
            color: #0f172a;
            border: 1px solid #cbd5e1;
        }

        body.light .clock {
            color: #0369a1;
        }

        body.light .date {
            color: #334155;
        }

        body.light .timezone {
            color: #64748b;
        }

        @media(max-width: 450px) {
            .container {
                padding: 30px 15px;
            }

            h1 {
                font-size: 24px;
            }

            .date {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1> DIGITAL CLOCK </h1>

        <!-- Real Time Clock -->
        <div class="clock" id="clock">
            00:00:00
        </div>

        <!-- Date and Day -->
        <div class="date" id="date">
            Loading Date...
        </div>

        <div class="timezone">
            Local System Time
        </div>

        <!-- Buttons -->
        <div class="buttons">

            <button onclick="changeFormat()" id="formatBtn">
                Switch to 24-Hour
            </button>

            <button onclick="changeTheme()" id="themeBtn">
                Light Mode
            </button>

        </div>

    </div>

    <script>

        // Default format is 12-hour
        let is24Hour = false;

        // REAL-TIME CLOCK FUNCTION
        function updateClock() {

            const now = new Date();

            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            let ampm = hours >= 12 ? "PM" : "AM";

            // Convert into 12-hour format
            if (!is24Hour) {
                hours = hours % 12;
                hours = hours ? hours : 12;
            }

            // Add zero for single digits
            hours = String(hours).padStart(2, '0');
            minutes = String(minutes).padStart(2, '0');
            seconds = String(seconds).padStart(2, '0');

            let time;

            if (is24Hour) {
                time = hours + ":" + minutes + ":" + seconds;
            } else {
                time = hours + ":" + minutes + ":" + seconds + " " + ampm;
            }

            document.getElementById("clock").innerHTML = time;

            // DATE AND DAY DISPLAY
            const dateOptions = {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            };

            const dateText = now.toLocaleDateString(
                "en-IN",
                dateOptions
            );

            document.getElementById("date").innerHTML = dateText;
        }

        // 12-HOUR / 24-HOUR FORMAT
        function changeFormat() {

            is24Hour = !is24Hour;

            const button = document.getElementById("formatBtn");

            if (is24Hour) {
                button.innerHTML = "Switch to 12-Hour";
            } else {
                button.innerHTML = "Switch to 24-Hour";
            }

            updateClock();
        }

        // DARK / LIGHT MODE
        function changeTheme() {

            document.body.classList.toggle("light");

            const button = document.getElementById("themeBtn");

            if (document.body.classList.contains("light")) {
                button.innerHTML = "Dark Mode";
            } else {
                button.innerHTML = "Light Mode";
            }
        }

        // UPDATE EVERY SECOND
        updateClock();

        setInterval(updateClock, 1000);

    </script>

</body>
</html>
